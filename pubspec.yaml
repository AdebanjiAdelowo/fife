name: fife
description: "FiFe — Fitness at Your Fingertips. The official Fit & Feline mobile companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Formatting & utilities
  intl: ^0.20.2
  crypto: ^3.0.5

  # Local persistence (no backend needed for v1)
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # UI / charts / pickers
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # Sharing for workout report summaries
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
